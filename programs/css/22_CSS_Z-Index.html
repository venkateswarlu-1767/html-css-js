<!DOCTYPE html>
<html>

<head>
    <title>CSS Z-Index</title>
    <style>
        body {
            font-family: Arial;
        }

        .container {
            position: relative;
            height: 300px;
            margin: 50px;
        }

        .box {
            position: absolute;
            width: 150px;
            height: 150px;
            padding: 10px;
            color: white;
        }

        .box1 {
            background: red;
            left: 20px;
            top: 20px;
            z-index: 1;
        }

        .box2 {
            background: blue;
            left: 80px;
            top: 80px;
            z-index: 2;
        }

        .box3 {
            background: green;
            left: 140px;
            top: 140px;
            z-index: 3;
        }
    </style>
</head>

<body>
    <h1>CSS z-index</h1>

    <div class="container">
        <div class="box box1">z-index: 1</div>
        <div class="box box2">z-index: 2</div>
        <div class="box box3">z-index: 3</div>
    </div>
</body>

</html>
