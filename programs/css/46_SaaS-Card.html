<!DOCTYPE html>
<html>

<head>
    <title>SaaS Card</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9
        }

        .card {
            width: 300px;
            background: white;
            padding: 25px;
            margin: 50px auto;
            border-radius: 12px;
            box-shadow: 0 4px 12px #bbb
        }

        button {
            background: blue;
            color: white;
            padding: 12px;
            border: 0;
            border-radius: 5px
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>CloudApp</h2>
        <p>Manage your projects easily.</p>
        <button>Get Started</button>
    </div>
</body>

</html>
