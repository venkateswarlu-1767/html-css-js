<!DOCTYPE html>
<html>

<head>
    <title>CSS Text Properties</title>

    <style>
        h1 {
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
        }

        p {
            text-align: justify;
            text-indent: 50px;
            letter-spacing: 2px;
            word-spacing: 5px;
            line-height: 2;
        }

        .decoration {
            text-decoration: line-through;
        }
    </style>
</head>

<body>

    <h1>CSS Text Properties</h1>

    <p>
        CSS is used to style webpages. It controls text,
        colors, spacing, alignment and many other properties.
    </p>

    <p class="decoration">
        This text has line-through decoration.
    </p>

</body>

</html>
