<!DOCTYPE html>
<html>

<head>
    <title>CSS Measurement Units</title>
    <style>
        html {
            font-size: 16px;
        }

        body {
            font-family: Arial;
            margin: 0;
        }

        .em-box {
            font-size: 20px;
            padding: 1em;
            background: lightblue;
        }

        .rem-box {
            font-size: 2rem;
            padding: 1rem;
            background: lightgreen;
        }

        .vw-box {
            width: 50vw;
            background: orange;
            padding: 10px;
        }

        .vh-box {
            height: 20vh;
            background: pink;
            padding: 10px;
        }

        .percent-box {
            width: 70%;
            background: lightyellow;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>CSS Units</h1>

    <div class="em-box">
        Padding uses 1em
    </div>

    <div class="rem-box">
        Font size uses 2rem
    </div>

    <div class="vw-box">
        Width uses 50vw
    </div>

    <div class="vh-box">
        Height uses 20vh
    </div>

    <div class="percent-box">
        Width uses 70%
    </div>
</body>

</html>
