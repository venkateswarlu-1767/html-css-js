<!DOCTYPE html>
<html>

<head>
    <title>CSS Functions</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .card {
            width: calc(100% - 40px);
            min-height: 150px;
            background: lightblue;
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(24px, 5vw, 45px);
        }

        .small {
            width: min(100%, 500px);
            background: lightgreen;
            padding: 20px;
            box-sizing: border-box;
        }

        .large {
            width: max(250px, 50%);
            background: pink;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CSS Functions</h1>

        <div class="card">
            <h2>calc()</h2>
            Width: calc(100% - 40px)
        </div>

        <div class="small">
            <h2>min()</h2>
            Maximum width is 500px.
        </div>

        <br>

        <div class="large">
            <h2>max()</h2>
            Width is at least 250px.
        </div>
    </div>
</body>

</html>
