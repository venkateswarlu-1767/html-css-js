<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JavaScript 35 - Stopwatch</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;line-height:1.5;background:#f5f7fb;color:#172033}
.card,pre,.box{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}
input,button{padding:10px;margin:5px;border:1px solid #bbb;border-radius:7px}button{cursor:pointer}
img{max-width:100%;border-radius:10px}.clock{font-size:2rem;font-weight:bold;margin:20px 0}
.keys{display:grid;grid-template-columns:repeat(4,70px);gap:5px}.keys button{margin:0}
.done{text-decoration:line-through;opacity:.6}.dark{background:#111;color:#eee}.dark .card{background:#222}
</style></head>
<body><p><a href="index.html">← JavaScript Index</a></p>
<h1>Question 35</h1><p><strong>Create a stopwatch using JavaScript.</strong></p><div class="card"><div id="sw" class="clock">0.0 s</div><button id="start">Start</button><button id="stop">Stop</button><button id="reset">Reset</button></div>
<script>let start = 0, elapsed = 0, timer;
function render() { document.getElementById('sw').textContent = `${(elapsed/1000).toFixed(1)} s`; }
document.getElementById('start').onclick = () => {
  if (timer) return;
  start = Date.now() - elapsed;
  timer = setInterval(() => { elapsed = Date.now()-start; render(); }, 100);
};
document.getElementById('stop').onclick = () => { clearInterval(timer); timer=null; };
document.getElementById('reset').onclick = () => { clearInterval(timer); timer=null; elapsed=0; render(); };</script></body></html>
