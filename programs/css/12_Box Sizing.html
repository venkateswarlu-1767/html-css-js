<!DOCTYPE html>
<html>

<head>
    <title>Box Sizing</title>

    <style>
        .content {
            box-sizing: content-box;

            width: 300px;
            padding: 30px;
            border: 5px solid red;

            background-color: lightblue;
            margin: 20px;
        }

        .border {
            box-sizing: border-box;

            width: 300px;
            padding: 30px;
            border: 5px solid blue;

            background-color: lightgreen;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Box Sizing</h1>

    <div class="content">
        Content-box
    </div>

    <div class="border">
        Border-box
    </div>

</body>

</html>
