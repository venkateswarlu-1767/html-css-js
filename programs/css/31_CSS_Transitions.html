<!DOCTYPE html>
<html>

<head>
    <title>CSS Transitions</title>
    <style>
        .box {
            width: 150px;
            height: 100px;
            background: steelblue;
            transition: all 1s;
        }

        .box:hover {
            width: 300px;
            background: orange;
            transform: translateX(20px);
        }
    </style>
</head>

<body>
    <h1>CSS Transitions</h1>
    <div class="box"></div>
    <p>Hover over the box.</p>
</body>

</html>
