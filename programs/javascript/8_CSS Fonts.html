<!DOCTYPE html>
<html>

<head>
    <title>CSS Fonts</title>

    <style>
        .p1 {
            font-family: Arial;
            font-size: 20px;
            font-weight: bold;
        }

        .p2 {
            font-family: Georgia;
            font-size: 25px;
            font-style: italic;
        }

        .p3 {
            font-family: "Times New Roman";
            font-variant: small-caps;
        }
    </style>
</head>

<body>

    <h1>CSS Font Properties</h1>

    <p class="p1">Bold Arial Text</p>

    <p class="p2">Italic Georgia Text</p>

    <p class="p3">Small Caps Text</p>

</body>

</html>
