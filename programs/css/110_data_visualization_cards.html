<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>110. Data Visualization Cards</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}
.app{max-width:1180px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
.brand{font-weight:800;font-size:20px}.badge{padding:7px 11px;border-radius:999px;background:#e9eefc;color:#4056a8;font-size:12px;font-weight:700}
h1{font-size:32px;margin:0 0 8px}h2{font-size:18px;margin:0 0 14px}.muted{color:#697386}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:20px;box-shadow:0 8px 25px rgba(30,45,80,.06)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.pill{padding:6px 10px;border-radius:999px;background:#eef2f7;font-size:12px}
.big{font-size:30px;font-weight:800;margin:8px 0}.btn{border:0;border-radius:10px;padding:10px 14px;background:#273b8f;color:white;font-weight:700;cursor:pointer}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d9deea;border-radius:10px;background:white}
label{font-size:13px;font-weight:700;display:block;margin:12px 0 6px}.stack>*+*{margin-top:10px}
.bar{height:10px;background:#e9edf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:var(--w,60%);background:#5267c9;border-radius:inherit}
.bars{display:grid;gap:12px}.mini{font-size:12px;color:#667085}.chart{height:180px;display:flex;align-items:end;gap:8px;padding:15px 5px;border-bottom:1px solid #ddd}.col{width:100%;height:var(--h);background:#6576d6;border-radius:6px 6px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:7px 10px;border-radius:8px;background:#eef1f7;font-size:12px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#dce3ff;color:#354aa0;font-weight:800}.avatars{display:flex}.avatars .avatar{margin-left:-8px;border:3px solid white}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid #edf0f5;font-size:13px}
.notice{padding:13px;border-radius:12px;background:#f0f4ff;border:1px solid #dce4ff}.success{background:#eefaf2;border-color:#d5f0dc}.warn{background:#fff7e8;border-color:#f4dfb4}.danger{background:#fff0f0;border-color:#f2d0d0}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.step{padding:10px 13px;border-radius:10px;background:#eef1f6}.arrow{color:#98a2b3}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.heat span{height:28px;border-radius:4px;background:#eef1f6}.heat span:nth-child(3n){background:#cbd5fa}.heat span:nth-child(4n){background:#8998e4}.heat span:nth-child(7n){background:#5368c7}
.circle{width:130px;height:130px;border-radius:50%;background:conic-gradient(#566bd0 0 68%,#e8ebf2 68%);display:grid;place-items:center}.circle:after{content:"68%";width:78px;height:78px;border-radius:50%;background:white;display:grid;place-items:center;font-weight:800}
.timeline{border-left:2px solid #dfe4ee;padding-left:20px;display:grid;gap:18px}.event{position:relative}.event:before{content:"";position:absolute;left:-27px;top:4px;width:10px;height:10px;border-radius:50%;background:#566bd0}
.kpi{font-size:13px}.kpi strong{display:block;font-size:25px;margin-top:4px}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.app{padding:20px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}h1{font-size:25px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">CSS Lab • Experiment 110</div><span class="badge">Standalone HTML + CSS</span></div>
  <h1>Data Visualization Cards</h1>
  <p class="muted">Experiment 110 from the supplied CSS experiment list.</p>
  
<div class="grid">
  <section class="card"><h2>Active Users</h2><div class="big">24,680</div><div class="mini">+12.4% this period</div><div class="bar" style="margin-top:15px"><i style="--w:78%"></i></div></section>
  <section class="card"><h2>Conversion</h2><div class="big">8.7%</div><div class="mini">Target: 10%</div><div class="bar" style="margin-top:15px"><i style="--w:87%"></i></div></section>
  <section class="card"><h2>Revenue</h2><div class="big">$128.4K</div><div class="mini">Monthly recurring revenue</div></section>
  <section class="card" style="grid-column:span 2"><h2>Analytics Visualization</h2><div class="chart"><div class="col" style="--h:35%"></div><div class="col" style="--h:55%"></div><div class="col" style="--h:42%"></div><div class="col" style="--h:76%"></div><div class="col" style="--h:62%"></div><div class="col" style="--h:88%"></div><div class="col" style="--h:70%"></div><div class="col" style="--h:92%"></div><div class="col" style="--h:66%"></div><div class="col" style="--h:80%"></div><div class="col" style="--h:73%"></div><div class="col" style="--h:96%"></div></div></section>
  <section class="card"><h2>Filters</h2><label>Date range</label><select><option>Last 30 days</option><option>Last 90 days</option></select><label>Segment</label><select><option>All users</option><option>Customers</option></select></section>
</div>

</div>
</body>
</html>
