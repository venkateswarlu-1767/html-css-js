<!DOCTYPE html>
<html>

<head>
    <title>CSS Colors</title>

    <style>
        body {
            background-color: lightgray;
        }

        h1 {
            color: blue;
        }

        p {
            color: green;
            background-color: white;
        }

        .box {
            border: 3px solid red;
            padding: 20px;
            background-color: yellow;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Colors</h1>

    <p>This text uses a text color.</p>

    <div class="box">
        This box uses background and border colors.
    </div>

    <br>

    <button>Click Me</button>

</body>

</html>
