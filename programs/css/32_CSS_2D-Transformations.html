<!DOCTYPE html>
<html>

<head>
    <title>2D Transformations</title>
    <style>
        .box {
            width: 150px;
            height: 100px;
            margin: 40px;
            background: lightblue;
            transition: 1s;
        }

        .box:hover {
            transform: rotate(20deg) scale(1.2) translateX(30px) skew(10deg);
        }
    </style>
</head>

<body>
    <h1>CSS 2D Transformations</h1>
    <div class="box">Hover Me</div>
</body>

</html>
