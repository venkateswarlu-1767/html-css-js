<!DOCTYPE html>
<html>

<head>
    <title>Responsive Webpage</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .box {
            flex: 1;
            padding: 30px;
            border: 2px solid black;
            text-align: center;
        }

        /* Mobile screen */
        @media (max-width: 600px) {

            .container {
                flex-direction: column;
            }

            .box {
                width: auto;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Website</h1>

    <div class="container">

        <div class="box">
            <h2>Box 1</h2>
            <p>Content of Box 1</p>
        </div>

        <div class="box">
            <h2>Box 2</h2>
            <p>Content of Box 2</p>
        </div>

    </div>

</body>

</html>
