<!DOCTYPE html>
<html>

<head>
    <title>Profile Card</title>
    <style>
        .card {
            width: 280px;
            text-align: center;
            font-family: Arial;
            margin: 40px auto;
            padding: 25px;
            background: #eee;
            border-radius: 15px
        }

        img {
            width: 100px;
            height: 100px;
            border-radius: 50%
        }

        button {
            padding: 10px;
            background: blue;
            color: white;
            border: 0
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="https://i.pravatar.cc/150" alt="Profile">
        <h2>John Smith</h2>
        <p>Web Developer</p>
        <p>Creates modern websites.</p>
        <button>View Profile</button>
    </div>
</body>

</html>
