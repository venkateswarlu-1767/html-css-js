<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JavaScript 33 - Quiz Application</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;line-height:1.5;background:#f5f7fb;color:#172033}
.card,pre,.box{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}
input,button{padding:10px;margin:5px;border:1px solid #bbb;border-radius:7px}button{cursor:pointer}
img{max-width:100%;border-radius:10px}.clock{font-size:2rem;font-weight:bold;margin:20px 0}
.keys{display:grid;grid-template-columns:repeat(4,70px);gap:5px}.keys button{margin:0}
.done{text-decoration:line-through;opacity:.6}.dark{background:#111;color:#eee}.dark .card{background:#222}
</style></head>
<body><p><a href="index.html">← JavaScript Index</a></p>
<h1>Question 33</h1><p><strong>Create a simple quiz application.</strong></p><div class="card"><div id="quiz"></div><button id="checkQuiz">Check Quiz</button><p id="quizResult"></p></div>
<script>const questions = [
  {q:'Capital of India?', options:['Delhi','Mumbai','Chennai'], answer:'Delhi'},
  {q:'2 + 2 = ?', options:['3','4','5'], answer:'4'}
];
const quiz = document.getElementById('quiz');
questions.forEach((item,i) => {
  quiz.innerHTML += `<p><b>${i+1}. ${item.q}</b></p>` +
    item.options.map(o=>`<label><input type="radio" name="q${i}" value="${o}"> ${o}</label>`).join(' ');
});
document.getElementById('checkQuiz').onclick = () => {
  const score = questions.reduce((s,item,i) =>
    s + (document.querySelector(`input[name=q${i}]:checked`)?.value === item.answer ? 1 : 0), 0);
  document.getElementById('quizResult').textContent = `Score: ${score}/${questions.length}`;
};</script></body></html>
