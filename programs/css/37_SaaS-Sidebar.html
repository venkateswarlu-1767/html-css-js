<!DOCTYPE html>
<html>

<head>
    <title>SaaS Sidebar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex
        }

        aside {
            width: 200px;
            height: 100vh;
            background: #172554;
            padding: 20px;
            color: white
        }

        a {
            display: block;
            color: white;
            padding: 15px;
            text-decoration: none
        }

        a:hover {
            background: #334155
        }

        main {
            padding: 30px
        }
    </style>
</head>

<body>
    <aside>
        <h2>MyApp</h2>
        <a href="#">Dashboard</a>
        <a href="#">Projects</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
    </aside>
    <main>
        <h1>Dashboard</h1>
        <p>Welcome to your workspace.</p>
    </main>
</body>

</html>
