<!DOCTYPE html>
<html>

<head>
    <title>Width and Height</title>

    <style>
        .box {
            width: 300px;
            height: 150px;

            min-width: 200px;
            max-width: 500px;

            min-height: 100px;
            max-height: 300px;

            background-color: lightgreen;
            border: 2px solid green;

            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Width and Height</h1>

    <div class="box">
        This box demonstrates width, height,
        min-width, max-width, min-height and max-height.
    </div>

</body>

</html>
