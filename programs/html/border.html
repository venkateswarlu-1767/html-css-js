<!DOCTYPE html>
<html>

<head>
    <title>CSS Properties</title>

    <style>
        /* Element selector */
        h1 {
            color: blue;
            font-family: Arial;
        }

        /* Class selector */
        .box {
            background-color: lightgray;
            margin: 20px;
            padding: 20px;
            border: 3px solid black;
        }

        /* ID selector */
        #special {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Example</h1>

    <div class="box">
        <p id="special">
            This is a styled paragraph.
        </p>

        <p>
            CSS is used to design webpages.
        </p>
    </div>

</body>

</html>
