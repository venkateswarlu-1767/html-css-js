<!DOCTYPE html>
<html>

<head>
    <title>SaaS Navbar</title>
    <style>
        body {
            font-family: Arial;
            margin: 0
        }

        nav {
            background: #172554;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between
        }

        a {
            color: white;
            text-decoration: none;
            margin: 10px
        }
    </style>
</head>

<body>
    <nav>
        <strong>CloudApp</strong>
        <div>
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <a href="#">Login</a>
        </div>
    </nav>
    <h1>Welcome to CloudApp</h1>
</body>

</html>
