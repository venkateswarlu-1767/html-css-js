body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;line-height:1.5;background:#f5f7fb;color:#172033}
.card,pre,.box{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}

<body><p><a href="index.html">← JavaScript Index</a></p>
<h1>Question 67</h1><p><strong>Write a program to validate an email address using a regular expression.</strong></p><div class="card"><pre id="output">Run the program to see the result.</pre></div>
<script>const email = 'student@example.com';
const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
document.getElementById('output').textContent = `${email} is ${pattern.test(email) ? 'Valid' : 'Invalid'}.`;</script></body></html>
