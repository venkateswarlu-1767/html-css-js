<h1>Question 38</h1><p><strong>Demonstrate ES6 let, const, template literals, and destructuring.</strong></p><div class="card"><pre id="output">Run the program to see the result.</pre></div>
<script>let name = 'Lakku';
const course = 'CSE';
const student = { name, course, year: 3 };
const { name: studentName, course: studentCourse } = student;
document.getElementById('output').textContent = `Hello ${studentName}, welcome to ${studentCourse}.` + `\nTemplate literal + destructuring demonstrated.`;</script></body></html>
