<!DOCTYPE html>
<html>

<head>
    <title>Pricing Cards</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px
        }

        .card {
            width: 250px;
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ccc
        }

        .price {
            font-size: 30px;
            color: blue
        }

        button {
            background: blue;
            color: white;
            padding: 12px 25px;
            border: 0;
            border-radius: 5px
        }
    </style>
</head>

<body>
    <h1 align="center">Pricing Plans</h1>
    <div class="container">
        <div class="card">
            <h2>Basic</h2>
            <p class="price">₹199</p>
            <p>1 User</p>
            <p>5 Projects</p>
            <button>Choose Plan</button>
        </div>
        <div class="card">
            <h2>Pro</h2>
            <p class="price">₹499</p>
            <p>5 Users</p>
            <p>Unlimited Projects</p>
            <button>Choose Plan</button>
        </div>
        <div class="card">
            <h2>Premium</h2>
            <p class="price">₹999</p>
            <p>Unlimited Users</p>
            <p>Priority Support</p>
            <button>Choose Plan</button>
        </div>
    </div>
</body>

</html>
