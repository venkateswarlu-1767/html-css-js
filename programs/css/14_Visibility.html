<!DOCTYPE html>
<html>

<head>
    <title>Visibility and Opacity</title>

    <style>
        .visible {
            background-color: lightgreen;
            padding: 20px;
        }

        .hidden {
            visibility: hidden;
            background-color: red;
            padding: 20px;
        }

        .opacity1 {
            opacity: 1;
            background-color: blue;
            color: white;
            padding: 20px;
        }

        .opacity5 {
            opacity: 0.5;
            background-color: blue;
            color: white;
            padding: 20px;
        }

        .opacity0 {
            opacity: 0;
            background-color: blue;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Visibility and Opacity</h1>

    <div class="visible">
        Visible Element
    </div>

    <div class="hidden">
        Hidden Element
    </div>

    <div class="opacity1">
        Opacity 1
    </div>

    <br>

    <div class="opacity5">
        Opacity 0.5
    </div>

    <br>

    <div class="opacity0">
        Opacity 0
    </div>

</body>

</html>
