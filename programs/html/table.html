<!DOCTYPE html>
<html>

<head>
    <title>HTML Table</title>

    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th,
        td {
            border: 2px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Student Marks</h1>

    <table>
        <tr>
            <th colspan="3">Student Details</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td rowspan="2">Rahul</td>
            <td>Maths</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Python</td>
            <td>85</td>
        </tr>
    </table>

</body>

</html>
