<!DOCTYPE html>
<html>

<head>
    <title>CSS Combinators</title>

    <style>
        /* Descendant Selector */
        .container p {
            color: blue;
        }

        /* Child Selector */
        .container>h2 {
            color: red;
        }

        /* Adjacent Sibling */
        h3+p {
            background-color: yellow;
        }

        /* General Sibling */
        h3~div {
            border: 2px solid green;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Child Selector</h2>

        <p>Descendant paragraph</p>

        <h3>Heading</h3>

        <p>Adjacent sibling paragraph</p>

        <div>General sibling 1</div>
        <div>General sibling 2</div>

    </div>

</body>

</html>
