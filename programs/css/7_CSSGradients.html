<!DOCTYPE html>
<html>

<head>
    <title>CSS Gradients</title>

    <style>
        .linear {
            height: 200px;
            background: linear-gradient(red, yellow, green);
            text-align: center;
            padding-top: 50px;
        }

        .radial {
            height: 200px;
            background: radial-gradient(circle, blue, white, purple);
            text-align: center;
            padding-top: 50px;
        }
    </style>
</head>

<body>

    <h1>CSS Gradients</h1>

    <div class="linear">
        Linear Gradient
    </div>

    <br>

    <div class="radial">
        Radial Gradient
    </div>

</body>

</html>
