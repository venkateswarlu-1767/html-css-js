<!DOCTYPE html>
<html>

<head>
    <title>CSS Units</title>
    <style>
        html {
            font-size: 16px;
        }

        body {
            font-family: Arial;
            margin: 0;
        }

        .percentage {
            width: 80%;
            height: 100px;
            background: lightblue;
        }

        .viewport {
            width: 50vw;
            height: 20vh;
            background: lightgreen;
        }

        .rem-box {
            font-size: 2rem;
            background: orange;
            padding: 1rem;
        }
    </style>
</head>

<body>
    <h1>CSS Units</h1>

    <div class="percentage">
        Width: 80%
    </div>

    <div class="viewport">
        Width: 50vw, Height: 20vh
    </div>

    <div class="rem-box">
        Font size: 2rem
    </div>
</body>

</html>
