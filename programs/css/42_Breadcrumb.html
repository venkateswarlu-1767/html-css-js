<!DOCTYPE html>
<html>

<head>
    <title>Breadcrumb</title>
    <style>
        body {
            font-family: Arial
        }

        .breadcrumb {
            background: #eee;
            padding: 15px
        }

        a {
            color: blue;
            text-decoration: none
        }

        span {
            margin: 10px;
            color: gray
        }
    </style>
</head>

<body>
    <div class="breadcrumb">
        <a href="#">Home</a><span>/</span>
        <a href="#">Products</a><span>/</span>
        <a href="#">Electronics</a><span>/</span>
        <strong>Mobile</strong>
    </div>
    <h1>Mobile Products</h1>
</body>

</html>
