<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JavaScript 31 - Validate Name Email Phone Password</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;line-height:1.5;background:#f5f7fb;color:#172033}
.card,pre,.box{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}
input,button{padding:10px;margin:5px;border:1px solid #bbb;border-radius:7px}button{cursor:pointer}
img{max-width:100%;border-radius:10px}.clock{font-size:2rem;font-weight:bold;margin:20px 0}
.keys{display:grid;grid-template-columns:repeat(4,70px);gap:5px}.keys button{margin:0}
.done{text-decoration:line-through;opacity:.6}.dark{background:#111;color:#eee}.dark .card{background:#222}
</style></head>
<body><p><a href="index.html">← JavaScript Index</a></p>
<h1>Question 31</h1><p><strong>Validate name, email, phone number, and password using JavaScript.</strong></p><div class="card"><input id="vname" placeholder="Name"><input id="email" placeholder="Email"><input id="phone" placeholder="Phone"><input id="password" type="password" placeholder="Password"><button id="validateBtn">Validate</button><pre id="validationResult"></pre></div>
<script>const checks = {
  name: /^[A-Za-z ]{2,}$/,
  email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
  phone: /^\d{10}$/,
  password: /^(?=.*[A-Za-z])(?=.*\d).{8,}$/
};
document.getElementById('validateBtn').addEventListener('click', () => {
  const values = {
    name: document.getElementById('vname').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    password: document.getElementById('password').value
  };
  const result = Object.entries(checks).map(([k,re]) => `${k}: ${re.test(values[k]) ? 'Valid' : 'Invalid'}`).join('\n');
  document.getElementById('validationResult').textContent = result;
});</script></body></html>
