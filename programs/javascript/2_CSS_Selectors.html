<!DOCTYPE html>
<html>

<head>
    <title>CSS Selectors</title>

    <style>
        /* Universal Selector */
        * {
            font-family: Arial;
        }

        /* Element Selector */
        h1 {
            color: blue;
        }

        /* Class Selector */
        .box {
            background-color: lightgreen;
        }

        /* ID Selector */
        #special {
            color: red;
        }

        /* Attribute Selector */
        input[type="text"] {
            border: 2px solid blue;
        }

        /* Grouping Selector */
        h2,
        p {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2>Class Selector</h2>

    <div class="box">
        This uses a class selector.
    </div>

    <p id="special">This uses an ID selector.</p>

    <input type="text" placeholder="Attribute selector">

</body>

</html>
