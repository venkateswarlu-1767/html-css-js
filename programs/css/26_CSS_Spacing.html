<!DOCTYPE html>
<html>

<head>
    <title>CSS Spacing</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
        }

        .box {
            background: lightblue;
            border: 2px solid blue;
        }

        .margin-box {
            margin: 30px;
            padding: 20px;
        }

        .padding-box {
            margin: 10px;
            padding: 40px;
        }

        .small-space {
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>CSS Spacing</h1>

    <div class="box margin-box">
        Margin: 30px and Padding: 20px
    </div>

    <div class="box padding-box">
        Margin: 10px and Padding: 40px
    </div>

    <div class="box small-space">
        Margin: 10px and Padding: 10px
    </div>
</body>

</html>
