<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JavaScript 29 - Number Guessing Game</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;line-height:1.5;background:#f5f7fb;color:#172033}
.card,pre,.box{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}
input,button{padding:10px;margin:5px;border:1px solid #bbb;border-radius:7px}button{cursor:pointer}
img{max-width:100%;border-radius:10px}.clock{font-size:2rem;font-weight:bold;margin:20px 0}
.keys{display:grid;grid-template-columns:repeat(4,70px);gap:5px}.keys button{margin:0}
.done{text-decoration:line-through;opacity:.6}.dark{background:#111;color:#eee}.dark .card{background:#222}
</style></head>
<body><p><a href="index.html">← JavaScript Index</a></p>
<h1>Question 29</h1><p><strong>Create a number guessing game.</strong></p><div class="card"><input id="guess" type="number" min="1" max="100" placeholder="1-100"><button id="guessBtn">Guess</button><p id="guessResult"></p></div>
<script>const target = Math.floor(Math.random()*100)+1;
document.getElementById('guessBtn').addEventListener('click', () => {
  const guess = Number(document.getElementById('guess').value);
  document.getElementById('guessResult').textContent =
    guess === target ? 'Correct!' : guess < target ? 'Too low!' : 'Too high!';
});</script></body></html>
