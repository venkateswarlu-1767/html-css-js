<!DOCTYPE html>
<html>

<head>
    <title>Product Card</title>
    <style>
        .card {
            width: 250px;
            padding: 20px;
            font-family: Arial;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 10px
        }

        img {
            width: 200px;
            height: 150px;
            object-fit: cover
        }

        .price {
            color: green;
            font-size: 22px
        }

        button {
            background: green;
            color: white;
            padding: 12px;
            border: 0
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="https://picsum.photos/300/200" alt="Product">
        <h2>Smart Watch</h2>
        <p>Modern smart watch</p>
        <p class="price">₹2,499</p>
        <button>Add to Cart</button>
    </div>
</body>

</html>
